<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Factory Lane — owner intake check</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#faf9f5;color:#25362f;margin:0;padding:32px}main{max-width:680px;margin:auto}button{font:inherit;padding:12px 20px;border:0;background:#a64520;color:white;border-radius:4px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}#verification{margin:24px 0}</style></head><body><main><h1>Owner intake verification</h1><p>This page submits one clearly labelled TEST with example contact details. It does not accept customer information, send email or confirm an appointment.</p><div id="verification"></div><p id="verification-status" role="status">Loading security verification…</p><button id="save" type="button">Save TEST request</button><p id="status" role="status" aria-live="polite">Nothing submitted.</p><pre id="receipt"></pre></main><script>
(async()=>{
 const endpoint='https://portal-intake.olexkol44.workers.dev';
 const key=crypto.randomUUID();let token='',busy=false,widget,api;
 const verification=document.querySelector('#verification-status');const status=document.querySelector('#status');
 const payload={kind:'factory_appointment',mode:'home',products:'Windows',quantity:'3–5',postal:'M5V 2T6',name:'OWNER TEST ONLY',email:'test@example.com',phone:'',day:'Flexible',message:'OWNER TEST ONLY — integration verification '+key,interest:'TEST',offer:false,utm:{utm_source:'owner-qa',utm_medium:'manual',utm_campaign:'intake-check'},privacyAcknowledged:true,website:''};
 document.querySelector('#save').addEventListener('click',async()=>{
  if(busy)return;if(!token){status.textContent='Complete security verification first. Nothing submitted.';return;}
  busy=true;status.textContent='Saving TEST…';
  try{const response=await fetch(endpoint+'/v1/submissions',{method:'POST',credentials:'omit',signal:AbortSignal.timeout(30000),headers:{'Content-Type':'application/json','Idempotency-Key':key},body:JSON.stringify({...payload,turnstileToken:token})});const data=await response.json();
   if(response.status!==202||data.status!=='saved'||typeof data.reference!=='string'||!/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(data.reference))throw new Error('unconfirmed');
   status.textContent='TEST saved. Verify this reference and both outbox jobs in D1. Email delivery is not confirmed.';document.querySelector('#receipt').textContent='Request key: '+key+'\nSaved reference: '+data.reference;
  }catch{status.textContent='Save not confirmed. The same TEST key is retained for retry; no success is claimed.';}
  finally{busy=false;token='';if(api&&widget!==undefined)api.reset(widget);}
 });
 try{const response=await fetch(endpoint+'/v1/public-config',{credentials:'omit',cache:'no-store',signal:AbortSignal.timeout(8000)});if(!response.ok)throw new Error('config');const config=await response.json();if(!config.sitekey||config.action!=='portal_intake')throw new Error('config');
  await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';script.async=true;const timer=setTimeout(()=>{script.remove();reject(new Error('script_timeout'));},10000);script.onload=()=>{clearTimeout(timer);resolve();};script.onerror=()=>{clearTimeout(timer);reject(new Error('script_failed'));};document.head.append(script);});
  api=window.turnstile;widget=api.render(document.querySelector('#verification'),{sitekey:config.sitekey,action:'portal_intake',theme:'light',size:'flexible',callback:value=>{token=value;verification.textContent='Security check complete.';},'expired-callback':()=>{token='';verification.textContent='Verification expired. Reload this owner-only check before another TEST.';},'error-callback':()=>{token='';verification.textContent='Verification unavailable. No TEST submitted.';}});
 }catch{verification.textContent='Security configuration unavailable for this origin. No TEST submitted.';}
})();
</script></body></html>
